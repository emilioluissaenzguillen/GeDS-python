name: Python package

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - name: Install GeDS from its R repository
        shell: Rscript {0}
        run: |
          install.packages("remotes")
          remotes::install_git(
            "https://github.com/emilioluissaenzguillen/GeDS.git",
            ref = "2501e11f510ebf81598b4852fbaea7667507f565",
            dependencies = NA,
            upgrade = "never"
          )

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Configure embedded R shared libraries
        if: runner.os == 'Linux'
        shell: bash
        run: echo "LD_LIBRARY_PATH=$(R RHOME)/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Install build and test dependencies
        run: python -m pip install --upgrade pip build pytest

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install the built wheel
        run: python -m pip install --find-links dist "geds-python[plot]"

      - name: Smoke-test embedded R
        run: >-
          python -u -c "from geds._backend import _configure_r_process;
          print('R home:', _configure_r_process(), flush=True);
          import rpy2.robjects;
          print('Embedded R initialized', flush=True)"

      - name: Run Python/R integration tests
        run: python -m pytest -q
