[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "geds-python"
version = "0.1.0a3"
description = "Python estimators backed by the GeDS R package"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["splines", "regression", "statistics", "R", "scikit-learn"]
authors = [
  {name = "Dimitrina S. Dimitrova"},
  {name = "Vladimir K. Kaishev"},
  {name = "Andrea Lattuada"},
  {name = "Emilio L. Sáenz Guillén"},
  {name = "Richard J. Verrall"},
]
maintainers = [
  {name = "Emilio L. Sáenz Guillén", email = "emilioluissaenzguillen@gmail.com"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "rpy2>=3.6.7,<3.7",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["build>=1.2", "matplotlib>=3.8", "pytest>=8"]
plot = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/emilioluissaenzguillen/GeDS-python"
Repository = "https://github.com/emilioluissaenzguillen/GeDS-python"
Issues = "https://github.com/emilioluissaenzguillen/GeDS-python/issues"
Changelog = "https://github.com/emilioluissaenzguillen/GeDS-python/blob/main/CHANGELOG.md"
"R package" = "https://github.com/emilioluissaenzguillen/GeDS"

[tool.hatch.build.targets.wheel]
packages = ["src/geds"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/LICENSE",
  "/README.md",
  "/RELEASING.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
